name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check JS
        run: node --check lib/index.js && node --check lib/client.js
      - name: Syntax check Python
        run: python -m py_compile pet/run_pet.py
      - name: Syntax check shell
        run: |
          for f in checks/*.sh pet/install_pet.sh pet/start.command examples/smoke-test.sh; do
            bash -n "$f" || exit 1
          done
      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json ok')"
